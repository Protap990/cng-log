<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNG Filling Log Formatter</title>
    <link rel="icon" type="image/png" href="Hplogo.png" />
  <link rel="apple-touch-icon" href="Hplogo.png" />
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 14px; display: flex; justify-content: center; }
    .card { width: 100%; max-width: 520px; background: #1e293b; border-radius: 12px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h2 { margin: 0 0 14px 0; font-size: 1.25rem; color: #38bdf8; text-align: center; }
    .section-title { font-size: 0.82rem; color: #38bdf8; font-weight: 700; text-transform: uppercase; margin: 14px 0 8px 0; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    label { font-size: 0.75rem; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 3px; }
    input[type="text"], input[type="number"] { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 9px; font-size: 0.85rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    
    .time-input-group { display: flex; gap: 4px; }
    .time-input-group input { flex: 1; min-width: 0; }
    .ampm-toggle { display: flex; border: 1px solid #334155; border-radius: 6px; overflow: hidden; background: #0f172a; }
    .ampm-toggle label { margin: 0; padding: 8px 6px; font-size: 0.72rem; cursor: pointer; color: #94a3b8; user-select: none; display: flex; align-items: center; justify-content: center; }
    .ampm-toggle input[type="radio"] { display: none; }
    .ampm-toggle input[type="radio"]:checked + span { color: #fff; font-weight: 700; background: #0284c7; border-radius: 4px; padding: 2px 5px; }

    .btn-row { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-gen { background: #0284c7; color: #fff; }
    .btn-copy { background: #16a34a; color: #fff; display: none; }
    pre { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: #e2e8f0; margin-top: 14px; }
  </style>
</head>
<body>

<div class="card">
  <h2>CNG Filling Log Entry</h2>

  <div class="grid">
    <div>
      <label>Number of LCV</label>
      <input type="number" id="numLcv" value="1" />
    </div>
    <div>
      <label>Pumps Used</label>
      <input type="text" id="pumpsUsed" value="P21A & P21B" />
    </div>
  </div>

  <div class="section-title">Pump Timings (Time & AM/PM)</div>
  <div class="grid">
    <!-- P21A Start -->
    <div>
      <label>Pump P21A Start Time</label>
      <div class="time-input-group">
        <input type="text" id="p21aStart" placeholder="04:27" oninput="syncStart()" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21aStartM" value="AM" onchange="syncStart()"><span>AM</span></label>
          <label><input type="radio" name="p21aStartM" value="PM" checked onchange="syncStart()"><span>PM</span></label>
        </div>
      </div>
    </div>

    <!-- P21A Stop -->
    <div>
      <label>Pump P21A Stop Time</label>
      <div class="time-input-group">
        <input type="text" id="p21aStop" placeholder="05:27" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21aStopM" value="AM"><span>AM</span></label>
          <label><input type="radio" name="p21aStopM" value="PM" checked><span>PM</span></label>
        </div>
      </div>
    </div>

    <!-- P21B Start -->
    <div>
      <label>Pump P21B Start Time (Auto)</label>
      <div class="time-input-group">
        <input type="text" id="p21bStart" placeholder="04:27" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21bStartM" value="AM"><span>AM</span></label>
          <label><input type="radio" name="p21bStartM" value="PM" checked><span>PM</span></label>
        </div>
      </div>
    </div>

    <!-- P21B Stop -->
    <div>
      <label>Pump P21B Stop Time</label>
      <div class="time-input-group">
        <input type="text" id="p21bStop" placeholder="05:36" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21bStopM" value="AM"><span>AM</span></label>
          <label><input type="radio" name="p21bStopM" value="PM" checked><span>PM</span></label>
        </div>
      </div>
    </div>
  </div>

  <div class="section-title">Tank 1A & 1B (KG)</div>
  <div class="grid">
    <div>
      <label>Tank 1A Before (KG)</label>
      <input type="number" id="t1aBefore" placeholder="e.g. 15200" />
    </div>
    <div>
      <label>Tank 1B Before (KG)</label>
      <input type="number" id="t1bBefore" placeholder="e.g. 15243" />
    </div>
    <div>
      <label>Tank 1A After (KG)</label>
      <input type="number" id="t1aAfter" placeholder="e.g. 14780" />
    </div>
    <div>
      <label>Tank 1B After (KG)</label>
      <input type="number" id="t1bAfter" placeholder="e.g. 14802" />
    </div>
  </div>

  <div class="section-title">Flow Meter FM101 (KG)</div>
  <div class="grid">
    <div>
      <label>FM101 Before Filling</label>
      <input type="number" id="fmBefore" placeholder="e.g. 2827889" />
    </div>
    <div>
      <label>FM101 After Filling</label>
      <input type="number" id="fmAfter" placeholder="e.g. 2828784" />
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-gen" onclick="generateReport()">Calculate & Format</button>
    <button id="copyBtn" class="btn-copy" onclick="copyLog()">Copy Text</button>
  </div>

  <pre id="output">Fill the fields and tap Calculate...</pre>
</div>

<script>
  let p21bUserModified = false;

  document.getElementById("p21bStart").addEventListener("input", () => { p21bUserModified = true; });
  document.querySelectorAll('input[name="p21bStartM"]').forEach(el => {
    el.addEventListener("change", () => { p21bUserModified = true; });
  });

  function syncStart() {
    if (!p21bUserModified) {
      document.getElementById("p21bStart").value = document.getElementById("p21aStart").value;
      const aVal = document.querySelector('input[name="p21aStartM"]:checked')?.value || "PM";
      const bRadio = document.querySelector(`input[name="p21bStartM"][value="${aVal}"]`);
      if (bRadio) bRadio.checked = true;
    }
  }

  function getTimeStr(inputId, radioName) {
    const val = document.getElementById(inputId).value.trim();
    if (!val) return "--:-- PM";
    const ampm = document.querySelector(`input[name="${radioName}"]:checked`)?.value || "PM";
    return `${val} ${ampm}`;
  }

  function getNum(id) {
    const val = document.getElementById(id).value.trim();
    return val !== "" ? parseFloat(val) : null;
  }

  function getStr(id, fallback = "---") {
    const val = document.getElementById(id).value.trim();
    return val !== "" ? val : fallback;
  }

  function generateReport() {
    const numLcv = getStr("numLcv", "1");
    const pumpsUsed = getStr("pumpsUsed", "P21A & P21B");

    const p21aStart = getTimeStr("p21aStart", "p21aStartM");
    const p21aStop  = getTimeStr("p21aStop", "p21aStopM");
    const p21bStart = getTimeStr("p21bStart", "p21bStartM");
    const p21bStop  = getTimeStr("p21bStop", "p21bStopM");

    const t1aBefore = getNum("t1aBefore") || 0;
    const t1bBefore = getNum("t1bBefore") || 0;
    const t1aAfter  = getNum("t1aAfter") || 0;
    const t1bAfter  = getNum("t1bAfter") || 0;

    const totalBefore = t1aBefore + t1bBefore;
    const totalAfter  = t1aAfter + t1bAfter;
    const tankDiff    = (totalBefore > 0 && totalAfter > 0) ? (totalBefore - totalAfter) : "---";

    const fmBefore = getNum("fmBefore");
    const fmAfter  = getNum("fmAfter");
    const fmDiff   = (fmBefore !== null && fmAfter !== null) ? (fmAfter - fmBefore) : "---";

    // Matches your exact example structure and spacing
    const report = `CNG LCV filling completed. 
Pump Used:- ${pumpsUsed}
Number of LCV= ${numLcv}

Pump P21A Start Time:- ${p21aStart}.
Pump P21A Stop Time:- ${p21aStop}.

Pump P21B Start Time:- ${p21bStart}.
Pump P21B Stop Time:- ${p21bStop}.

Total Tank(1A+1B) Quantity Before LCV Filling:  ${totalBefore || "---"} KG

Total Tank(1A+1B) Quantity After LCV Filling: ${totalAfter || "---"}  KG

Difference: ${tankDiff} KG

FM101 (Before Filling):
${fmBefore ?? "---"} KG
FM101 (After Filling):
${fmAfter ?? "---"} KG

Difference: ${fmDiff} KG`;

    document.getElementById("output").innerText = report;
    document.getElementById("copyBtn").style.display = "inline-block";
  }

  function copyLog() {
    const text = document.getElementById("output").innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById("copyBtn");
      btn.innerText = "✓ Copied!";
      setTimeout(() => { btn.innerText = "Copy Text"; }, 2000);
    });
  }
</script>
</body>
</html>
