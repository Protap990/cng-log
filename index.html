<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNG Filling Log Formatter</title>
  <link rel="icon" type="image/png" href="Hplogo.png" />
  <link rel="apple-touch-icon" href="Hplogo.png" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1329; color: #f1f5f9; margin: 0; padding: 16px; display: flex; justify-content: center; }
    
    .card {
      position: relative;
      overflow: hidden;
      background-color: #111e34;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      padding: 24px 20px 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid #1e293b;
    }

    .powered-by {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.68rem;
      color: rgba(148, 163, 184, 0.45);
      letter-spacing: 0.4px;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    .card::before {
      content: "HPCL";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 7.5rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.04);
      pointer-events: none;
      user-select: none;
      z-index: 0;
      letter-spacing: 4px;
    }

    h2, .section-title, .row, .btn-group, pre, .or-divider {
      position: relative;
      z-index: 2;
    }

    h2 { color: #38bdf8; text-align: center; margin: 10px 0 16px; font-size: 1.35rem; }
    .section-title { color: #38bdf8; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin: 18px 0 8px; letter-spacing: 0.5px; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .col { flex: 1; display: flex; flex-direction: column; }
    label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; }
    input[type="text"], input[type="number"] {
      background-color: #1a2744; border: 1px solid #2d3f66; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; outline: none; -webkit-appearance: none;
    }
    input:focus { border-color: #38bdf8; }
    .time-group { display: flex; gap: 4px; }
    .time-group input { flex: 1; min-width: 0; }
    .ampm-toggle {
      display: flex; background-color: #1a2744; border: 1px solid #2d3f66; border-radius: 6px; overflow: hidden;
    }
    .ampm-toggle label {
      font-size: 0.75rem; font-weight: bold; cursor: pointer; color: #94a3b8; margin-bottom: 0; user-select: none;
    }
    .ampm-toggle input { display: none; }
    .ampm-toggle input:checked + span { background-color: #0284c7; color: #fff; }
    .ampm-toggle span { display: block; padding: 10px 8px; border-radius: 4px; }
    
    .or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 4px 0 8px;
      color: #64748b;
      font-size: 0.7rem;
      font-weight: bold;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px dashed #2d3f66;
    }
    .or-divider:not(:empty)::before { margin-right: .5em; }
    .or-divider:not(:empty)::after { margin-left: .5em; }

    .btn-group { display: flex; gap: 10px; margin-top: 18px; }
    button {
      flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    .btn-calc { background-color: #0284c7; color: white; }
    .btn-copy { background-color: #16a34a; color: white; }
    pre {
      background-color: #0a1122; border: 1px solid #1e293b; border-radius: 8px; padding: 14px; font-size: 0.85rem; color: #e2e8f0; white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="powered-by">Powered by AllBross Ltd.</div>

  <h2>CNG Filling Log Entry</h2>

  <div class="row">
    <div class="col">
      <label>Number of LCV</label>
      <input type="number" id="lcvCount" value="1" />
    </div>
    <div class="col">
      <label>Pumps Used</label>
      <input type="text" id="pumpsUsed" value="P21A & P21B" />
    </div>
  </div>

  <div class="section-title">Pump Timings (Time & AM/PM)</div>
  <div class="row">
    <div class="col">
      <label>Pump P21A Start Time</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21aStart" placeholder="04:27" oninput="syncStartTimes()" onkeyup="syncStartTimes()" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21aStartAmpm" value="AM" onchange="syncAmpm()"/><span>AM</span></label>
          <label><input type="radio" name="p21aStartAmpm" value="PM" checked onchange="syncAmpm()"/><span>PM</span></label>
        </div>
      </div>
    </div>
    <div class="col">
      <label>Pump P21A Stop Time</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21aStop" placeholder="05:27" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21aStopAmpm" value="AM"/><span>AM</span></label>
          <label><input type="radio" name="p21aStopAmpm" value="PM" checked/><span>PM</span></label>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Pump P21B Start Time (Auto)</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21bStart" placeholder="04:27" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21bStartAmpm" value="AM"/><span>AM</span></label>
          <label><input type="radio" name="p21bStartAmpm" value="PM" checked/><span>PM</span></label>
        </div>
      </div>
    </div>
    <div class="col">
      <label>Pump P21B Stop Time</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21bStop" placeholder="05:36" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21bStopAmpm" value="AM"/><span>AM</span></label>
          <label><input type="radio" name="p21bStopAmpm" value="PM" checked/><span>PM</span></label>
        </div>
      </div>
    </div>
  </div>

  <div class="section-title">Tank 1A & 1B (KG)</div>
  <div class="row">
    <div class="col">
      <label>Tank 1A Before (KG)</label>
      <input type="number" id="t1aBefore" placeholder="e.g. 15200" step="any" />
    </div>
    <div class="col">
      <label>Tank 1B Before (KG)</label>
      <input type="number" id="t1bBefore" placeholder="e.g. 15243" step="any" />
    </div>
  </div>

  <div class="or-divider">OR (DIRECT TOTAL BEFORE)</div>
  <div class="row">
    <div class="col">
      <label>Total Before Filling (KG) - Optional</label>
      <input type="number" id="tTotalBeforeDirect" placeholder="e.g. 30443 (bypass 1A & 1B)" step="any" />
    </div>
  </div>

  <div class="row" style="margin-top: 6px;">
    <div class="col">
      <label>Tank 1A After (KG)</label>
      <input type="number" id="t1aAfter" placeholder="e.g. 14780" step="any" />
    </div>
    <div class="col">
      <label>Tank 1B After (KG)</label>
      <input type="number" id="t1bAfter" placeholder="e.g. 14802" step="any" />
    </div>
  </div>

  <div class="section-title">Flow Meter FM101 (KG)</div>
  <div class="row">
    <div class="col">
      <label>FM101 Before Filling</label>
      <input type="number" id="fmBefore" placeholder="e.g. 2827889" step="any" />
    </div>
    <div class="col">
      <label>FM101 After Filling</label>
      <input type="number" id="fmAfter" placeholder="e.g. 2828784" step="any" />
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-calc" onclick="generateReport()">Calculate & Format</button>
    <button class="btn-copy" onclick="copyText()">Copy Text</button>
  </div>

  <pre id="outputLog">Output preview will appear here...</pre>
</div>

<script>
  let p21bManual = false;
  const p21bStartInput = document.getElementById('p21bStart');
  
  p21bStartInput.addEventListener('input', () => { p21bManual = true; });
  p21bStartInput.addEventListener('focus', () => { p21bManual = true; });

  function syncStartTimes() {
    if (!p21bManual) {
      document.getElementById('p21bStart').value = document.getElementById('p21aStart').value;
    }
  }

  function syncAmpm() {
    const checked = document.querySelector('input[name="p21aStartAmpm"]:checked');
    if (checked && !p21bManual) {
      const val = checked.value;
      const target = document.querySelector(`input[name="p21bStartAmpm"][value="${val}"]`);
      if (target) target.checked = true;
    }
  }

  function getRadio(name) {
    const r = document.querySelector(`input[name="${name}"]:checked`);
    return r ? r.value : 'PM';
  }

  function generateReport() {
    const lcv = document.getElementById('lcvCount').value.trim();
    const pumps = document.getElementById('pumpsUsed').value.trim();

    const p21aStart = document.getElementById('p21aStart').value.trim();
    const p21aStop = document.getElementById('p21aStop').value.trim();
    const p21bStart = document.getElementById('p21bStart').value.trim();
    const p21bStop = document.getElementById('p21bStop').value.trim();

    const p21aStartAmpm = getRadio('p21aStartAmpm');
    const p21aStopAmpm = getRadio('p21aStopAmpm');
    const p21bStartAmpm = getRadio('p21bStartAmpm');
    const p21bStopAmpm = getRadio('p21bStopAmpm');

    const t1aB = parseFloat(document.getElementById('t1aBefore').value);
    const t1bB = parseFloat(document.getElementById('t1bBefore').value);
    const directTotalB = parseFloat(document.getElementById('tTotalBeforeDirect').value);

    const t1aA = parseFloat(document.getElementById('t1aAfter').value);
    const t1bA = parseFloat(document.getElementById('t1bAfter').value);

    const fmB = parseFloat(document.getElementById('fmBefore').value);
    const fmA = parseFloat(document.getElementById('fmAfter').value);

    // Resolve "Before" Tank Total: Direct Total takes priority if individual values aren't fully provided
    let tankBeforeTotal = null;
    let beforeString = "";

    if (!isNaN(directTotalB)) {
      tankBeforeTotal = directTotalB;
      beforeString = `${directTotalB} Kg.`;
    } else if (!isNaN(t1aB) && !isNaN(t1bB)) {
      tankBeforeTotal = t1aB + t1bB;
      beforeString = `${t1aB} + ${t1bB}= ${tankBeforeTotal} Kg.`;
    } else {
      beforeString = `${!isNaN(t1aB) ? t1aB : '--'} + ${!isNaN(t1bB) ? t1bB : '--'}= -- Kg.`;
    }

    const hasValidBefore = tankBeforeTotal !== null;

    // Check if any required field is missing
    const isMissing = !lcv || !pumps || !p21aStart || !p21aStop || !p21bStart || !p21bStop ||
                      !hasValidBefore || isNaN(t1aA) || isNaN(t1bA) ||
                      isNaN(fmB) || isNaN(fmA);

    if (isMissing) {
      alert("Missing data! Please check your entries.");
    }

    // Calculations
    const tankAfterTotal = (!isNaN(t1aA) && !isNaN(t1bA)) ? (t1aA + t1bA) : null;
    const tankDiff = (tankBeforeTotal !== null && tankAfterTotal !== null) ? Math.abs(tankBeforeTotal - tankAfterTotal) : null;
    const fmDiff = (!isNaN(fmA) && !isNaN(fmB)) ? Math.abs(fmA - fmB) : null;

    // Build Output
    const report = 
`CNG LCV filling completed.
Pump Used:- ${pumps || '--'}
Number of LCV= ${lcv || '--'}

Pump P21A Start Time:- ${p21aStart || '--'} ${p21aStartAmpm}.
Pump P21A Stop Time:- ${p21aStop || '--'} ${p21aStopAmpm}.

Pump P21B Start Time:- ${p21bStart || '--'} ${p21bStartAmpm}.
Pump P21B Stop Time:- ${p21bStop || '--'} ${p21bStopAmpm}.

Tank 1A & 1B before filling:-
${beforeString}

Tank 1A & 1B after filling:-
${!isNaN(t1aA) ? t1aA : '--'} + ${!isNaN(t1bA) ? t1bA : '--'}= ${tankAfterTotal !== null ? tankAfterTotal : '--'} Kg.

Total Quantity (${tankBeforeTotal !== null ? tankBeforeTotal : '--'} - ${tankAfterTotal !== null ? tankAfterTotal : '--'})= ${tankDiff !== null ? tankDiff.toFixed(2) : '--'} Kg.

FM101 Before Filling:- ${!isNaN(fmB) ? fmB : '--'} Kg.
FM101 After Filling:- ${!isNaN(fmA) ? fmA : '--'} Kg.
Total Filling Quantity:- ${fmDiff !== null ? fmDiff.toFixed(2) : '--'} Kg.`;

    document.getElementById('outputLog').innerText = report;
  }

  function copyText() {
    const text = document.getElementById('outputLog').innerText;
    if (!text || text.startsWith('Output preview')) {
      alert('Please calculate the report first!');
      return;
    }
    navigator.clipboard.writeText(text).then(() => {
      alert('Report copied to clipboard!');
    }).catch(() => {
      alert('Failed to copy. Please select and copy manually.');
    });
  }
</script>

</body>
</html>
