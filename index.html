<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNG Filling Log Formatter</title>
  <link rel="icon" type="image/png" href="Hplogo.png" />
  <link rel="apple-touch-icon" href="Hplogo.png" />
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body {
      background: radial-gradient(circle at top, #0f2042 0%, #060b18 100%);
      color: #f1f5f9;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    
    .card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(165deg, #132247 0%, #0c152c 100%);
      width: 100%;
      max-width: 490px;
      border-radius: 18px;
      padding: 24px 20px 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .powered-by {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 0.68rem;
      font-weight: 600;
      color: #7dd3fc;
      opacity: 0.6;
      letter-spacing: 0.6px;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    .card::before {
      content: "HPCL";
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 8.5rem;
      font-weight: 900;
      color: rgba(56, 189, 248, 0.04);
      pointer-events: none;
      user-select: none;
      z-index: 0;
      letter-spacing: 6px;
    }

    h2, .section-title, .row, .btn-group, .chat-preview-wrap, .or-divider {
      position: relative;
      z-index: 2;
    }

    h2 {
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin: 12px 0 18px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      margin: 18px 0 8px;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title-pumps { color: #38bdf8; }
    .title-tanks { color: #fb7185; }
    .title-fm { color: #34d399; }

    .row { display: flex; gap: 10px; margin-bottom: 10px; }
    .col { flex: 1; display: flex; flex-direction: column; }
    label { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
    
    input[type="text"], input[type="number"] {
      background: rgba(15, 28, 56, 0.85);
      border: 1px solid #2d4375;
      color: #fff;
      padding: 11px;
      border-radius: 8px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      -webkit-appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }
    
    .time-group { display: flex; gap: 6px; }
    .time-group input { flex: 1; min-width: 0; }
    
    .ampm-toggle {
      display: flex;
      background: rgba(15, 28, 56, 0.95);
      border: 1px solid #2d4375;
      border-radius: 8px;
      overflow: hidden;
      padding: 2px;
      gap: 2px;
    }
    .ampm-toggle label {
      cursor: pointer;
      margin-bottom: 0;
      user-select: none;
    }
    .ampm-toggle input { display: none; }
    .ampm-toggle span {
      display: block;
      padding: 9px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .ampm-toggle input:checked + span {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
    }
    
    .or-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 6px 0 8px;
      color: #e879f9;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px dashed rgba(232, 121, 249, 0.35);
    }
    .or-divider:not(:empty)::before { margin-right: .6em; }
    .or-divider:not(:empty)::after { margin-left: .6em; }

    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
    }
    button:active { transform: scale(0.98); opacity: 0.9; }
    
    .btn-calc {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .btn-copy {
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.4);
    }

    .chat-preview-wrap {
      margin-top: 20px;
      background: #091422;
      border-radius: 14px;
      padding: 14px;
      border: 1px solid #1c2e4a;
    }
    .chat-label {
      font-size: 0.72rem;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .wa-bubble {
      background-color: #d9fdd3;
      color: #111b21;
      border-radius: 10px;
      border-top-left-radius: 3px;
      padding: 12px 14px;
      font-size: 0.95rem;
      line-height: 1.45;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
      white-space: pre-wrap;
      word-wrap: break-word;
      user-select: text;
    }
    .wa-link {
      color: #027eb5;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="powered-by">Powered by AllBross Ltd.</div>

  <h2>CNG Filling Log Entry</h2>

  <div class="row">
    <div class="col">
      <label>Number of LCV</label>
      <input type="number" id="lcvCount" value="1" />
    </div>
    <div class="col">
      <label>Pumps Used (Auto-detects if left default)</label>
      <input type="text" id="pumpsUsed" value="P21A & P21B" />
    </div>
  </div>

  <div class="section-title title-pumps">⚡ Pump Timings (Time & AM/PM)</div>
  <div class="row">
    <div class="col">
      <label>Pump P21A Start Time</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21aStart" placeholder="04:27" maxlength="5" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21aStartAmpm" value="AM" onchange="handleStartAmpmChange('p21a')"/><span>AM</span></label>
          <label><input type="radio" name="p21aStartAmpm" value="PM" checked onchange="handleStartAmpmChange('p21a')"/><span>PM</span></label>
        </div>
      </div>
    </div>
    <div class="col">
      <label>Pump P21A Stop Time</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21aStop" placeholder="05:27" maxlength="5" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21aStopAmpm" value="AM"/><span>AM</span></label>
          <label><input type="radio" name="p21aStopAmpm" value="PM" checked/><span>PM</span></label>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Pump P21B Start Time (Auto)</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21bStart" placeholder="04:27" maxlength="5" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21bStartAmpm" value="AM" onchange="handleStartAmpmChange('p21b')"/><span>AM</span></label>
          <label><input type="radio" name="p21bStartAmpm" value="PM" checked onchange="handleStartAmpmChange('p21b')"/><span>PM</span></label>
        </div>
      </div>
    </div>
    <div class="col">
      <label>Pump P21B Stop Time (Leave blank/0 if not used)</label>
      <div class="time-group">
        <input type="text" inputmode="numeric" id="p21bStop" placeholder="05:36" maxlength="5" />
        <div class="ampm-toggle">
          <label><input type="radio" name="p21bStopAmpm" value="AM"/><span>AM</span></label>
          <label><input type="radio" name="p21bStopAmpm" value="PM" checked/><span>PM</span></label>
        </div>
      </div>
    </div>
  </div>

  <div class="section-title title-tanks">⛽ Tank 1A & 1B (KG)</div>
  <div class="row">
    <div class="col">
      <label>Tank 1A Before (KG)</label>
      <input type="number" id="t1aBefore" placeholder="e.g. 15200" step="any" />
    </div>
    <div class="col">
      <label>Tank 1B Before (KG)</label>
      <input type="number" id="t1bBefore" placeholder="e.g. 15243" step="any" />
    </div>
  </div>

  <div class="or-divider">OR (DIRECT TOTAL BEFORE)</div>
  <div class="row">
    <div class="col">
      <label>Total Before Filling (KG) - Optional</label>
      <input type="number" id="tTotalBeforeDirect" placeholder="e.g. 30443 (bypass 1A & 1B)" step="any" />
    </div>
  </div>

  <div class="row" style="margin-top: 6px;">
    <div class="col">
      <label>Tank 1A After (KG)</label>
      <input type="number" id="t1aAfter" placeholder="e.g. 14780" step="any" />
    </div>
    <div class="col">
      <label>Tank 1B After (KG)</label>
      <input type="number" id="t1bAfter" placeholder="e.g. 14802" step="any" />
    </div>
  </div>

  <div class="section-title title-fm">📊 Flow Meter FM101 (KG)</div>
  <div class="row">
    <div class="col">
      <label>FM101 Before Filling</label>
      <input type="number" id="fmBefore" placeholder="e.g. 2827889" step="any" />
    </div>
    <div class="col">
      <label>FM101 After Filling</label>
      <input type="number" id="fmAfter" placeholder="e.g. 2828784" step="any" />
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-calc" onclick="generateReport()">Calculate</button>
    <button class="btn-copy" onclick="copyText()">Copy Text</button>
  </div>

  <div class="chat-preview-wrap">
    <div id="outputBubble" class="wa-bubble">Tap "Calculate" to generate the message...</div>
  </div>
</div>

<script>
  let p21bManual = false;
  let rawClipboardText = "";

  const timeInputs = ['p21aStart', 'p21aStop', 'p21bStart', 'p21bStop'];

  function formatTimeInput(e) {
    let input = e.target;
    let digits = input.value.replace(/\D/g, '');
    
    if (e.inputType === 'deleteContentBackward') {
      return;
    }

    if (digits.length === 0) {
      input.value = '';
      return;
    }

    let first = parseInt(digits[0], 10);

    if (first > 1 && digits.length === 1) {
      input.value = '0' + digits[0] + ':';
      return;
    }

    if (digits.length >= 2) {
      let hours = parseInt(digits.substring(0, 2), 10);
      let rawMins = digits.substring(2, 4);

      if (hours > 12) {
        hours = 12;
      } else if (hours === 0) {
        hours = 1;
      }
      let formattedHours = hours < 10 ? '0' + hours : '' + hours;

      if (rawMins.length > 0) {
        let minsNum = parseInt(rawMins, 10);
        let firstMinDigit = parseInt(rawMins[0], 10);

        if (rawMins.length === 1 && firstMinDigit > 5) {
          rawMins = '59';
        } else if (rawMins.length === 2 && minsNum > 59) {
          rawMins = '59';
        }

        input.value = formattedHours + ':' + rawMins;
      } else {
        input.value = formattedHours + ':';
      }
    } else {
      input.value = digits;
    }
  }

  // Automatic AM/PM Determination for Stop Time
  function autoSetStopAmpm(pumpPrefix) {
    const startInput = document.getElementById(`${pumpPrefix}Start`).value.trim();
    const stopInput = document.getElementById(`${pumpPrefix}Stop`).value.trim();
    const startAmpmElem = document.querySelector(`input[name="${pumpPrefix}StartAmpm"]:checked`);

    if (!startAmpmElem) return;
    const startAmpm = startAmpmElem.value;

    // If stop time hasn't been entered with hours, simply follow start AM/PM
    if (!stopInput.includes(':')) {
      const radio = document.querySelector(`input[name="${pumpPrefix}StopAmpm"][value="${startAmpm}"]`);
      if (radio) radio.checked = true;
      return;
    }

    const stopHour = parseInt(stopInput.split(':')[0], 10);
    const startHour = startInput.includes(':') ? parseInt(startInput.split(':')[0], 10) : NaN;

    let targetStopAmpm = startAmpm;

    // Boundary Rollover Logic (e.g., 11:xx PM -> 12:xx or 01:xx AM)
    if (!isNaN(startHour) && startHour === 11 && (stopHour === 12 || stopHour <= 3)) {
      targetStopAmpm = (startAmpm === 'PM') ? 'AM' : 'PM';
    }

    const stopRadio = document.querySelector(`input[name="${pumpPrefix}StopAmpm"][value="${targetStopAmpm}"]`);
    if (stopRadio) stopRadio.checked = true;
  }

  function handleStartAmpmChange(pumpPrefix) {
    if (pumpPrefix === 'p21a') syncAmpm();
    autoSetStopAmpm(pumpPrefix);
  }

  timeInputs.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', (e) => {
      formatTimeInput(e);
      if (id === 'p21aStart') {
        syncStartTimes();
        autoSetStopAmpm('p21a');
      }
      if (id === 'p21aStop') {
        autoSetStopAmpm('p21a');
      }
      if (id === 'p21bStart') {
        p21bManual = true;
        autoSetStopAmpm('p21b');
      }
      if (id === 'p21bStop') {
        autoSetStopAmpm('p21b');
      }
    });
  });

  function syncStartTimes() {
    if (!p21bManual) {
      document.getElementById('p21bStart').value = document.getElementById('p21aStart').value;
      autoSetStopAmpm('p21b');
    }
  }

  function syncAmpm() {
    const checked = document.querySelector('input[name="p21aStartAmpm"]:checked');
    if (checked && !p21bManual) {
      const val = checked.value;
      const target = document.querySelector(`input[name="p21bStartAmpm"][value="${val}"]`);
      if (target) {
        target.checked = true;
        autoSetStopAmpm('p21b');
      }
    }
  }

  function getRadio(name) {
    const r = document.querySelector(`input[name="${name}"]:checked`);
    return r ? r.value : 'PM';
  }

  function isTimeValid(val) {
    if (!val) return false;
    let clean = val.trim();
    if (clean === "" || clean === "0" || clean === "00:00" || clean === "--") return false;
    return clean.includes(':');
  }

  function generateReport() {
    const lcv = document.getElementById('lcvCount').value.trim();
    let pumpsInput = document.getElementById('pumpsUsed').value.trim();

    const p21aStart = document.getElementById('p21aStart').value.trim();
    const p21aStop = document.getElementById('p21aStop').value.trim();
    const p21bStart = document.getElementById('p21bStart').value.trim();
    const p21bStop = document.getElementById('p21bStop').value.trim();

    const p21aStartAmpm = getRadio('p21aStartAmpm');
    const p21aStopAmpm = getRadio('p21aStopAmpm');
    const p21bStartAmpm = getRadio('p21bStartAmpm');
    const p21bStopAmpm = getRadio('p21bStopAmpm');

    const t1aB = parseFloat(document.getElementById('t1aBefore').value);
    const t1bB = parseFloat(document.getElementById('t1bBefore').value);
    const directTotalB = parseFloat(document.getElementById('tTotalBeforeDirect').value);

    const t1aA = parseFloat(document.getElementById('t1aAfter').value);
    const t1bA = parseFloat(document.getElementById('t1bAfter').value);

    const fmB = parseFloat(document.getElementById('fmBefore').value);
    const fmA = parseFloat(document.getElementById('fmAfter').value);

    const isP21aActive = isTimeValid(p21aStart) && isTimeValid(p21aStop);
    const isP21bActive = isTimeValid(p21bStart) && isTimeValid(p21bStop);

    if (pumpsInput === "P21A & P21B" || pumpsInput === "P21A" || pumpsInput === "P21B" || !pumpsInput) {
      if (isP21aActive && isP21bActive) {
        pumpsInput = "P21A & P21B";
      } else if (isP21aActive) {
        pumpsInput = "P21A";
      } else if (isP21bActive) {
        pumpsInput = "P21B";
      }
    }

    let tankBeforeTotal = null;
    if (!isNaN(directTotalB)) {
      tankBeforeTotal = directTotalB;
    } else if (!isNaN(t1aB) && !isNaN(t1bB)) {
      tankBeforeTotal = t1aB + t1bB;
    }

    const hasValidBefore = tankBeforeTotal !== null;
    const hasAtLeastOnePump = isP21aActive || isP21bActive;

    const isMissing = !lcv || !pumpsInput || !hasAtLeastOnePump ||
                      !hasValidBefore || isNaN(t1aA) || isNaN(t1bA) ||
                      isNaN(fmB) || isNaN(fmA);

    if (isMissing) {
      alert("Missing data! Please check your entries.");
    }

    const tankAfterTotal = (!isNaN(t1aA) && !isNaN(t1bA)) ? (t1aA + t1bA) : null;
    const tankDiff = (tankBeforeTotal !== null && tankAfterTotal !== null) ? Math.abs(tankBeforeTotal - tankAfterTotal) : null;
    const fmDiff = (!isNaN(fmA) && !isNaN(fmB)) ? Math.abs(fmA - fmB) : null;

    const fmBVal = !isNaN(fmB) ? fmB : '--';
    const fmAVal = !isNaN(fmA) ? fmA : '--';

    let timingsRaw = [];
    let timingsHtml = [];

    if (isP21aActive) {
      timingsRaw.push(`Pump P21A Start Time:- ${p21aStart} ${p21aStartAmpm}.\nPump P21A Stop Time:- ${p21aStop} ${p21aStopAmpm}.`);
      timingsHtml.push(`Pump P21A Start Time:- ${p21aStart} ${p21aStartAmpm}.\nPump P21A Stop Time:- ${p21aStop} ${p21aStopAmpm}.`);
    }

    if (isP21bActive) {
      timingsRaw.push(`Pump P21B Start Time:- ${p21bStart} ${p21bStartAmpm}.\nPump P21B Stop Time:- ${p21bStop} ${p21bStopAmpm}.`);
      timingsHtml.push(`Pump P21B Start Time:- ${p21bStart} ${p21bStartAmpm}.\nPump P21B Stop Time:- ${p21bStop} ${p21bStopAmpm}.`);
    }

    if (!isP21aActive && !isP21bActive) {
      timingsRaw.push(`Pump P21A Start Time:- ${p21aStart || '--'} ${p21aStartAmpm}.\nPump P21A Stop Time:- ${p21aStop || '--'} ${p21aStopAmpm}.`);
      timingsHtml.push(`Pump P21A Start Time:- ${p21aStart || '--'} ${p21aStartAmpm}.\nPump P21A Stop Time:- ${p21aStop || '--'} ${p21aStopAmpm}.`);
    }

    const timingsJoinedRaw = timingsRaw.join('\n\n');
    const timingsJoinedHtml = timingsHtml.join('\n\n');

    rawClipboardText = 
`CNG LCV filling completed.
Pump Used:- ${pumpsInput || '--'}
Number of LCV= ${lcv || '--'}

${timingsJoinedRaw}

Total Tank(1A+1B) Quantity Before LCV Filling:  ${tankBeforeTotal !== null ? tankBeforeTotal : '--'} KG

Total Tank(1A+1B) Quantity After LCV Filling: ${tankAfterTotal !== null ? tankAfterTotal : '--'} KG

Difference: ${tankDiff !== null ? tankDiff : '--'} KG

FM101 (Before Filling):
${fmBVal} KG
FM101 (After Filling):
${fmAVal} KG

Difference: ${fmDiff !== null ? fmDiff : '--'} KG`;

    const htmlPreview = 
`CNG LCV filling completed.
Pump Used:- ${pumpsInput || '--'}
Number of LCV= ${lcv || '--'}

${timingsJoinedHtml}

Total Tank(1A+1B) Quantity Before LCV Filling:  ${tankBeforeTotal !== null ? tankBeforeTotal : '--'} KG

Total Tank(1A+1B) Quantity After LCV Filling: ${tankAfterTotal !== null ? tankAfterTotal : '--'} KG

Difference: ${tankDiff !== null ? tankDiff : '--'} KG

FM101 (Before Filling):
<span class="wa-link">${fmBVal}</span> KG
FM101 (After Filling):
<span class="wa-link">${fmAVal}</span> KG

Difference: ${fmDiff !== null ? fmDiff : '--'} KG`;

    document.getElementById('outputBubble').innerHTML = htmlPreview;
  }

  function copyText() {
    if (!rawClipboardText) {
      alert('Please calculate the report first!');
      return;
    }
    navigator.clipboard.writeText(rawClipboardText).then(() => {
      alert('Report copied to clipboard! Paste directly into WhatsApp.');
    }).catch(() => {
      alert('Failed to copy. Please select and copy manually.');
    });
  }
</script>

</body>
</html>
